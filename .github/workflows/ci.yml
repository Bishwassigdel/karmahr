name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # BS date conversion assumes device time is Nepal time, as it is for
      # real users. Run tests the same way.
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Dates must not shift with the device timezone (the HR portal can be
      # opened from anywhere). New York is behind UTC and has daylight saving.
      - name: Date rules in another timezone
        run: flutter test test/domain test/state test/data
        env:
          TZ: America/New_York
